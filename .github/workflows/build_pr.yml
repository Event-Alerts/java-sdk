name: Build [PR]
on:
  pull_request:
    paths:
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'core/build.gradle.kts'
      - 'core/src/**'
      - 'http/build.gradle.kts'
      - 'http/src/**'
      - 'websocket/build.gradle.kts'
      - 'websocket/src/**'
  workflow_dispatch:

jobs:
  build:
    uses: srnyx/tools/.github/workflows/build.yml@main
    with:
      name: Event Alerts Java SDK
